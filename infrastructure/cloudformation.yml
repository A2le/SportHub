AWSTemplateFormatVersion: '2010-09-09'
Description: 'SportsHub static React SPA hosting and GitHub OIDC deployment role'

Parameters:
  AppName:
    Type: String
    Default: sportshub-coach
    AllowedPattern: '^[a-z][a-z0-9-]{2,35}$'
    Description: Unique app prefix used for resource names
  GitHubOwner:
    Type: String
    Description: GitHub monorepo owner (user or organisation)
  GitHubRepository:
    Type: String
    Description: Shared repository name only (not owner/repo)
  GitHubBranch:
    Type: String
    Default: main
  GitHubOidcSubject:
    Type: String
    Default: ''
    Description: 'Optional exact GitHub token sub claim; supply for immutable subject claims (newer repositories)'
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: 'Set if the GitHub OIDC provider already exists in this AWS account'

Conditions:
  CreateProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']
  CustomSubject: !Not [!Equals [!Ref GitHubOidcSubject, '']]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AppName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AppName}-${AWS::AccountId}-oac'
        Description: Private S3 access for SportsHub React frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRouteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AppName}-${AWS::AccountId}-spa-router'
      AutoPublish: true
      FunctionConfig:
        Comment: 'Rewrite client-side routes to index.html'
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/' || uri.endsWith('/')) {
            request.uri = '/index.html';
          } else {
            var lastPart = uri.substring(uri.lastIndexOf('/') + 1);
            if (lastPart.indexOf('.') === -1) {
              request.uri = '/index.html';
            }
          }
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AppName} frontend'
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: PrivateS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: PrivateS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouteFunction.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-github-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !If
                  - CustomSubject
                  - !Ref GitHubOidcSubject
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: DeployStaticSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt FrontendBucket.Arn
              - Sid: UploadDeleteObjects
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${FrontendBucket.Arn}/*'
              - Sid: InvalidateDistribution
                Effect: Allow
                Action: [cloudfront:CreateInvalidation]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  S3BucketName:
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
  WebsiteURL:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  GitHubDeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  GitHubOidcProviderArn:
    Value: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
