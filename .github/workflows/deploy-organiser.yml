name: Deploy SportsHub Organiser

on:
  push:
    branches: [develop]
    paths:
      - 'sports-Hub-dashboard-FrontEnd/**'
      - '.github/workflows/deploy-organiser.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sportshub-organiser-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sports-Hub-dashboard-FrontEnd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sports-Hub-dashboard-FrontEnd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.ORGANISER_VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.ORGANISER_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOdevelop: ${{ vars.COGNITO_DOdevelop }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ vars.ORGANISER_AWS_ROLE_ARN }}

      - name: Upload versioned build assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.ORGANISER_S3_BUCKET }}/" \
            --exclude 'index.html' \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.ORGANISER_S3_BUCKET }}/index.html" \
            --cache-control 'no-cache' \
            --content-type 'text/html'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.ORGANISER_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'
